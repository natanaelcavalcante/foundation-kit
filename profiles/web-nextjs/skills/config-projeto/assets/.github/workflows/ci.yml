name: ci
on: [push, pull_request]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - name: Unitários + cobertura (thresholds em cada vitest.config falham o job)
        run: npm run coverage
      - name: Integração (Testcontainers usa o Docker do runner)
        run: npm run test:int
      - name: Segurança
        run: |
          npm audit --audit-level=high
          npx --yes @semgrep/cli@latest scan --config auto --error || true
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  e2e:
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: docker compose up -d postgres redis minio mailpit
      - run: npm run db:migrate && npm run test:e2e
