# Ambiente local completo. Produção: mesma imagem do web + serviços gerenciados (Postgres/Redis) e Cloudflare R2.
services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["3000"]
    profiles: ["full"]          # em dev, rode `npm run dev` no host; `docker compose --profile full up` sobe tudo containerizado

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:                       # substituto local do Cloudflare R2 (API S3)
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:                     # captura e-mails em dev: http://localhost:8025
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [web]
    profiles: ["full"]

volumes: { pgdata: {}, redisdata: {}, miniodata: {}, caddydata: {} }
