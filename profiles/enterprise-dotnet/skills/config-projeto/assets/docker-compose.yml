services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8080"]
    profiles: ["full"]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    expose: ["80"]
    profiles: ["full"]

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: minio12345 }
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api, web]
    profiles: ["full"]

volumes: { pgdata: {}, miniodata: {} }
